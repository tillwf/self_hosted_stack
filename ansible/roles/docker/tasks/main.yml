---
# Docker's own repository, not Ubuntu's: the distribution package lags and
# does not ship the Compose v2 plugin.
- name: Ensure the keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch the Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Start Docker at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Membership of this group is equivalent to root on this host. One account.
- name: Put the admin user in the docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true
