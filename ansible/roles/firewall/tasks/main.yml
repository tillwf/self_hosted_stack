---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Default deny inbound
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outbound
  community.general.ufw:
    direction: outgoing
    policy: allow

# Allowed before sshd moves there, so the port is reachable the moment it
# starts listening.
- name: Allow the SSH port
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    comment: ssh

- name: Allow web and any extra published ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_base_tcp_ports + firewall_extra_tcp_ports }}"

# Without this, enabling ufw while sshd is still on the old port means the
# only way in is the session Ansible is already holding. Established
# connections survive, new ones do not.
- name: Allow the port Ansible is connected on, for the transition
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | default(22) }}"
    proto: tcp
    comment: ssh (pre-hardening, remove once ssh_port is verified)
  when:
    - firewall_keep_current_ssh_port
    - (ansible_port | default(22)) | int != ssh_port | int

- name: Enable ufw
  community.general.ufw:
    state: enabled
