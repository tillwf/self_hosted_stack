services:
    db:
        # Pinned to the running version. `postgres:16` floated within the major,
        # and the tag had already moved on, orphaning this container's image.
        image: postgres:16.6
        # Absolute path on purpose. This used to be `./data/postgres`, which
        # compose resolves against whatever directory holds this file — for a
        # Portainer stack that is /data/compose/<id>, so the data location
        # depended on the stack id and on who ran compose. See README.md.
        volumes:
            - /home/till/joplin_data/postgres:/var/lib/postgresql/data
        # No published port on purpose. The app reaches the database as
        # POSTGRES_HOST=db over the compose network, and no nginx-proxy-manager
        # host forwards to 5432, so publishing it only exposed Postgres to the
        # internet.
        restart: unless-stopped
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DATABASE}
    app:
        # Pinned to the running version. Note this is a beta build; moving to a
        # current stable release is a separate, deliberate upgrade.
        image: joplin/server:3.0.1-beta
        depends_on:
            - db
        # No published port. nginx-proxy-manager used to forward joplin.till.wf
        # to the host's public IP on 22300, which also left Joplin reachable
        # directly over plain HTTP, bypassing the proxy and its TLS. It now
        # reaches the app by name over the shared npm network instead.
        networks:
            default: {}
            npm:
                aliases:
                    - joplin
        restart: unless-stopped
        environment:
            - APP_PORT=22300
            - APP_BASE_URL=${APP_BASE_URL}
            - DB_CLIENT=pg
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DATABASE=${POSTGRES_DATABASE}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PORT=5432
            - POSTGRES_HOST=db
networks:
    npm:
        external: true
        name: npm_default
