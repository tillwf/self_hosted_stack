services:
  nc:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - 8081:443
      - 8080:80
    volumes:
      - nextcloud:/var/www/html
      - /home/till/nextcloud_data:/var/www/html/data
      - /home/till/Pictures:/opt/pictures:ro
      - /home/till/Documents:/opt/documents:ro
    networks:
      - redisnet
      - dbnet
    environment:
      - REDIS_HOST=redis
      - MYSQL_HOST=db
      - MYSQL_DATABASE=$MYSQL_DATABASE
      - MYSQL_USER=$MYSQL_USER
      - MYSQL_PASSWORD=$MYSQL_PASSWORD
  redis:
    # Pinned to the minor series currently deployed. `alpine` floated and would
    # have jumped majors on any recreate.
    image: redis:7.4-alpine
    restart: always
    networks:
      - redisnet
    expose:
      - 6379
  db:
    # Pinned to the series currently deployed. `latest` floated, so a recreate
    # could have landed on a MariaDB major Nextcloud does not support — and
    # MariaDB cannot be downgraded across majors in place.
    image: mariadb:11.7
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: always
    volumes:
      - nextcloud_db:/var/lib/mysql
    networks:
      - dbnet
    environment:
      - MYSQL_DATABASE=$MYSQL_DATABASE
      - MYSQL_USER=$MYSQL_USER
      - MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD=$MYSQL_PASSWORD
    expose:
      - 3306
volumes:
  nextcloud:
  nextcloud_db:
networks:
  dbnet:
  redisnet:
