services:
    portainer:
        # 2.18.2 speaks Docker API 1.37, but the host now runs Docker Engine 29,
        # which requires a minimum API version of 1.44. That combination cannot
        # reach the daemon at all, so keep this at a version that can.
        image: 'portainer/portainer-ce:2.45.1'
        restart: always
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data
        # Nothing is published. nginx-proxy-manager reaches the UI over the
        # shared npm network as http://portainer:9000 — plain HTTP is fine on an
        # internal docker network, and it avoids the self-signed cert that 9443
        # serves. Publishing 9443 put an admin UI with access to the Docker
        # socket, which is root-equivalent on this host, straight on the public
        # internet.
        #
        # 8000 is the Edge agent tunnel, previously published on 8888. It is
        # only needed if an Edge agent connects from off this host; publish it
        # again deliberately if that ever becomes true.
        networks:
            default: {}
            npm:
                aliases:
                    - portainer
volumes:
    portainer_data: {}
networks:
    npm:
        external: true
        name: npm_default
